<div class="panel" *ngIf="engine.patch as p">
    <div class="head">
        <h3>{{ p.name }} <small>{{ p.category }}</small></h3>
        <span class="desc">{{ p.description }}</span>
        <span class="octave">
            Octava
            <button (click)="engine.shiftOctave(-1)">&minus;</button>
            <b>{{ engine.octave }}</b>
            <button (click)="engine.shiftOctave(1)">+</button>
            <small>{{ range }}</small>
        </span>
        <label class="knob level">
            <span>Level</span>
            <input type="range" min="0" max="0.8" step="0.01" [value]="engine.level" (input)="setLevel($event.target.value)">
            <output>{{ engine.level }}</output>
        </label>
        <span class="voices">Voces: {{ engine.voiceCount }}</span>
    </div>

    <div class="sections">
        <section class="osc">
            <h4>Osc <button (click)="addLayer()" title="Agregar capa">+</button></h4>
            <div class="layer" *ngFor="let l of p.layers; let i = index">
                <div class="waves">
                    <button *ngFor="let w of waves" [class.on]="l.wave == w" (click)="l.wave = w">{{ w }}</button>
                    <button class="remove" (click)="removeLayer(i)" title="Quitar capa">&times;</button>
                    <span class="own" *ngIf="l.env" title="Esta capa tiene envolvente propia">env propia</span>
                </div>
                <div class="knobs">
                    <label class="knob" *ngFor="let k of layerKnobs">
                        <span>{{ k.label }}</span>
                        <input type="range" [min]="k.min" [max]="k.max" [step]="k.step" [value]="l[k.key]"
                            (input)="setNum(l, k.key, $event.target.value)">
                        <output>{{ l[k.key] }}{{ k.unit }}</output>
                    </label>
                </div>
            </div>
        </section>

        <section>
            <h4>Amp env</h4>
            <div class="knobs two">
                <label class="knob" *ngFor="let k of envKnobs">
                    <span>{{ k.label }}</span>
                    <input type="range" [min]="k.min" [max]="k.max" [step]="k.step" [value]="p.env[k.key]"
                        (input)="setNum(p.env, k.key, $event.target.value)">
                    <output>{{ p.env[k.key] }}{{ k.unit }}</output>
                </label>
            </div>
        </section>

        <section>
            <h4>Filter</h4>
            <div class="waves">
                <button *ngFor="let t of filterTypes" [class.on]="p.filter.type == t" (click)="p.filter.type = t">{{ t }}</button>
            </div>
            <div class="knobs two">
                <label class="knob" *ngFor="let k of filterKnobs">
                    <span>{{ k.label }}</span>
                    <input type="range" [min]="k.min" [max]="k.max" [step]="k.step" [value]="p.filter[k.key]"
                        (input)="setNum(p.filter, k.key, $event.target.value)">
                    <output>{{ p.filter[k.key] }}{{ k.unit }}</output>
                </label>
            </div>
        </section>

        <section>
            <h4>LFO</h4>
            <div class="waves">
                <button *ngFor="let t of lfoTargets" [class.on]="p.lfo.target == t" (click)="setLfoTarget(t)">{{ t }}</button>
            </div>
            <div class="knobs two">
                <label class="knob">
                    <span>{{ lfoRateKnob.label }}</span>
                    <input type="range" [min]="lfoRateKnob.min" [max]="lfoRateKnob.max" [step]="lfoRateKnob.step" [value]="p.lfo.rate"
                        (input)="setNum(p.lfo, 'rate', $event.target.value)">
                    <output>{{ p.lfo.rate }}{{ lfoRateKnob.unit }}</output>
                </label>
                <label class="knob">
                    <span>{{ lfoDepthRange.label }}</span>
                    <input type="range" [min]="lfoDepthRange.min" [max]="lfoDepthRange.max" [step]="lfoDepthRange.step" [value]="p.lfo.depth"
                        (input)="setNum(p.lfo, 'depth', $event.target.value)">
                    <output>{{ p.lfo.depth }}{{ lfoDepthRange.unit }}</output>
                </label>
            </div>
        </section>
    </div>
</div>
