server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los bancos de muestras (assets/sounds/*.js) son base64 dentro de JS: comprimen bien
  gzip on;
  gzip_types application/javascript text/css application/json;
  gzip_min_length 1024;

  # index.html apunta a los archivos con hash de cada version: si el navegador lo guarda, sigue mostrando
  # la version vieja despues de un despliegue. Se revalida siempre.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Los .js y .css llevan el hash en el nombre (main-es2015.<hash>.js): son inmutables
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Estado del backend. Si no esta, responde 200 con {"backend":false}: un 502 dejaria un error en la consola
  # del navegador en cada carga de la app, y la app es perfectamente usable sin backend.
  location = /api/health {
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    error_page 502 503 504 = @nobackend;
    add_header Cache-Control "no-store";
  }

  location @nobackend {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":false,"backend":false}';
  }

  # API del backend (proyectos guardados). Si el backend no esta, devuelve 502 y la app sigue andando sola.
  # API_UPSTREAM y NGINX_RESOLVER se completan al iniciar el contenedor (ver Dockerfile).
  location /api/ {
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
    add_header Cache-Control "no-store";
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
