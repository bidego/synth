<app-visualizer></app-visualizer>
<div handlekeys class="app">
  <h1>{{ title }}</h1>
  <div class="presets">
    <span *ngFor="let group of categories" class="presetGroup">
      <b>{{ group.name }}</b>
      <button *ngFor="let preset of group.presets"
        [class.on]="engine.patch.name == preset.name"
        (click)="loadPreset(preset, $event)" [title]="preset.description">{{ preset.name }}</button>
    </span>
  </div>
  <div class="fx">
    <b>FX</b>
    <label *ngFor="let k of fxKnobs">
      {{ k.label }}
      <input type="range" min="0" [max]="k.max" [step]="k.step" [value]="sound.fx[k.name]"
        (input)="setFx(k.name, $event.target.value)">
    </label>
  </div>
  <div class="midi" [class.on]="midi.devices.length">
    <b>MIDI</b> {{ midi.message }}
    <span *ngIf="midi.lastEvent">&middot; {{ midi.lastEvent }}</span>
    <span *ngIf="engine.sustain">&middot; sustain</span>
  </div>
  <app-piano></app-piano>
  <app-synth-panel></app-synth-panel>
</div>
