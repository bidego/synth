<div class="bar">
    <span class="legend"><i class="dot audio"></i> Audio <i class="dot note"></i> Notas</span>
    <span class="help">Arrastra de un puerto a otro para unirlos &middot; clic en un cable y <kbd>Supr</kbd> para quitarlo &middot; <kbd>Shift</kbd> + clic en un puerto lo desconecta</span>
    <span class="spacer"></span>
    <span class="error" *ngIf="rack.message" role="alert">{{ rack.message }}</span>
    <button (click)="autoLayout()" title="Acomoda los dispositivos de izquierda a derecha segun el flujo de la senal">Ordenar</button>
</div>

<div class="patch" #wrap (pointerdown)="clearSelection()">
    <svg class="cables" [attr.width]="width" [attr.height]="height">
        <g *ngFor="let c of paths">
            <path class="hit" [attr.d]="c.d" (pointerdown)="selectCable(c.id, $event)" (dblclick)="deleteCable(c.id)"></path>
            <path class="cable" [class.audio]="c.kind == 'audio'" [class.note]="c.kind == 'note'" [class.sel]="selectedCable == c.id" [attr.d]="c.d"></path>
            <g class="del" *ngIf="selectedCable == c.id" (pointerdown)="$event.stopPropagation()" (click)="deleteCable(c.id)">
                <circle [attr.cx]="c.mx" [attr.cy]="c.my" r="10"></circle>
                <path [attr.d]="'M' + (c.mx - 4) + ' ' + (c.my - 4) + ' L' + (c.mx + 4) + ' ' + (c.my + 4) + ' M' + (c.mx + 4) + ' ' + (c.my - 4) + ' L' + (c.mx - 4) + ' ' + (c.my + 4)"></path>
            </g>
        </g>
        <path *ngIf="drag" class="cable temp" [class.audio]="drag.kind == 'audio'" [class.note]="drag.kind == 'note'" [attr.d]="dragPath"></path>
    </svg>

    <div class="node" *ngFor="let m of rack.modules" [class.selected]="rack.selectedId == m.id"
        [style.left.px]="m.pos.x" [style.top.px]="m.pos.y" (pointerdown)="$event.stopPropagation(); rack.select(m.id)">
        <div class="head" (pointerdown)="startMove(m, $event)">
            <b>{{ m.name }}</b>
            <small>{{ typeLabel(m) }}</small>
        </div>
        <div class="ports">
            <div class="col in">
                <div class="port" *ngFor="let p of inPorts(m)">
                    <i class="jack" [class.audio]="p.kind == 'audio'" [class.note]="p.kind == 'note'" [class.used]="connected(m, p)" [class.ok]="canDrop(m, p)"
                        [attr.data-j]="m.id + ':' + p.id" (pointerdown)="startCable(m, p, $event)" [title]="p.label + ' (' + (p.kind == 'audio' ? 'audio' : 'notas') + ')'"></i>
                    <span>{{ p.label }}</span>
                </div>
            </div>
            <div class="col out">
                <div class="port" *ngFor="let p of outPorts(m)">
                    <span>{{ p.label }}</span>
                    <i class="jack" [class.audio]="p.kind == 'audio'" [class.note]="p.kind == 'note'" [class.used]="connected(m, p)" [class.ok]="canDrop(m, p)"
                        [attr.data-j]="m.id + ':' + p.id" (pointerdown)="startCable(m, p, $event)" [title]="p.label + ' (' + (p.kind == 'audio' ? 'audio' : 'notas') + ')'"></i>
                </div>
            </div>
        </div>
    </div>
</div>
