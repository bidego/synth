<button class="trigger" [class.open]="ui.menuOpen" (click)="toggle()" aria-haspopup="true" [attr.aria-expanded]="ui.menuOpen">
    <app-icon name="folder" [size]="15"></app-icon>
    <span class="txt">Proyecto<ng-container *ngIf="looper.projectName">: <b>{{ looper.projectName }}</b></ng-container></span>
    <app-icon name="chevron-down" [size]="13"></app-icon>
</button>

<div class="menu" *ngIf="ui.menuOpen" role="menu">
    <div class="section">
        <div class="label">Guardar</div>
        <div class="row">
            <input type="text" placeholder="Nombre del proyecto" maxlength="40" [value]="looper.projectName"
                (input)="looper.projectName = $event.target.value" (keydown.enter)="looper.saveNamed()" aria-label="Nombre del proyecto">
            <button class="primary icon" (click)="looper.saveNamed()" title="Guardar en este navegador">
                <app-icon name="save" [size]="14"></app-icon> Guardar
            </button>
        </div>
        <p class="note">Ademas, todo se autoguarda en este navegador.</p>
    </div>

    <div class="section">
        <div class="label">Abrir <small>({{ looper.saved.length }})</small></div>
        <div class="empty" *ngIf="!looper.saved.length">Todavia no hay proyectos guardados.</div>
        <ul class="saved">
            <li *ngFor="let s of looper.saved">
                <button class="open" (click)="looper.loadNamed(s.name)" title="Abrir este proyecto">
                    <span class="n">{{ s.name }}</span>
                    <small>{{ s.tracks }} pistas &middot; {{ savedAt(s.savedAt) }}</small>
                </button>
                <button class="ghost icon" (click)="looper.deleteNamed(s.name)" title="Borrar" aria-label="Borrar"><app-icon name="trash" [size]="14"></app-icon></button>
            </li>
        </ul>
    </div>

    <div class="section">
        <div class="label">Archivos</div>
        <div class="row wrap">
            <button class="icon" (click)="looper.exportFile()" title="Descargar el proyecto como archivo .json">
                <app-icon name="download" [size]="14"></app-icon> Exportar .json
            </button>
            <label class="file icon" title="Abrir un proyecto .json">
                <app-icon name="upload" [size]="14"></app-icon> Importar .json
                <input type="file" accept=".json,application/json" (change)="onImport($event)">
            </label>
        </div>
    </div>

    <div class="section">
        <div class="label">Audio</div>
        <div class="row wrap">
            <span class="seg">
                <button *ngFor="let n of passOptions" [class.on]="looper.exportPasses == n" (click)="looper.exportPasses = n">{{ n }}</button>
            </span>
            <span class="dim">vuelta(s) &middot; {{ looper.exportSeconds | number:'1.0-0' }} s</span>
        </div>
        <button class="primary icon wide" (click)="looper.exportWav()" [disabled]="looper.exporting"
            title="Renderiza el loop a un WAV sin perdida (16 bits, estereo, con efectos)">
            <app-icon name="download" [size]="14"></app-icon> {{ looper.exporting ? 'Exportando...' : 'Exportar WAV' }}
        </button>
    </div>

    <div class="msg" *ngIf="looper.message" role="status">{{ looper.message }}</div>
</div>
