<div class="transport" role="toolbar" aria-label="Transporte">
    <div class="buttons">
        <button class="rec" [class.on]="looper.recording" (click)="looper.toggleRecord()" title="Grabar (tecla ` )" aria-label="Grabar">
            <app-icon name="rec" [size]="14"></app-icon><span class="txt">Rec</span>
        </button>
        <button class="play" [class.on]="looper.playing && !looper.recording" (click)="looper.togglePlay()" title="Reproducir / detener (Enter)" aria-label="Reproducir o detener">
            <app-icon [name]="looper.playing ? 'stop' : 'play'" [size]="14"></app-icon><span class="txt">{{ looper.playing ? 'Stop' : 'Play' }}</span>
        </button>
    </div>

    <span class="beats" aria-hidden="true">
        <i *ngFor="let d of dots" [class.on]="looper.beatInBar == d" [class.count]="looper.countingIn"></i>
    </span>

    <label class="bpm field">
        <span class="label">BPM</span>
        <input type="range" min="40" max="220" step="1" [value]="looper.bpm" (input)="looper.setBpm($event.target.value)" aria-label="Tempo">
        <b>{{ looper.bpm }}</b>
    </label>

    <div class="field">
        <span class="label">Compases</span>
        <span class="seg">
            <button *ngFor="let b of barOptions" [class.on]="looper.bars == b" (click)="looper.setBars(b)">{{ b }}</button>
        </span>
    </div>

    <div class="field">
        <span class="label">Cuantizar</span>
        <span class="seg">
            <button *ngFor="let q of quantizes" [class.on]="looper.quantize == q.value" (click)="looper.setQuantize(q.value)">{{ q.label }}</button>
        </span>
    </div>

    <div class="field checks">
        <label><input type="checkbox" [checked]="looper.metronome" (change)="looper.setFlag('metronome', $event.target.checked)"> Metronomo</label>
        <label><input type="checkbox" [checked]="looper.countIn" (change)="looper.setFlag('countIn', $event.target.checked)"> Cuenta previa</label>
    </div>
</div>
