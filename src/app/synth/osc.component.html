<div #osc class="container">
    <div class="containerFrequency">
        <input #sliderFrequency
            (mousemove)="handleFrequency($event)"
            class="slider sliderFrequency"
            type="range" min="20" max="5000" step="1" value="600">
        <div class="modulo botonera">
            <button (click)="connectGainNode($event)" #play>&#9658;</button>
            <button (click)="disconnectGainNode($event)" #stop>&#9632;</button>
        </div>
        <div (click)="toggleWaveType($event)" class="modulo oscType">
            <button #sine value="sine" style="color:#F00">sine</button>
            <button #square value="square">square</button>
            <button #sawtooth value="sawtooth">sawtooth</button>
            <button #triangle value="triangle">triangle</button>
        </div>
        <div class="modulo">
            <input type="text" (change)="handleVolume($event)" #volumeView size="5" />db
            <input type="text" (change)="handleFrequency($event)" #frequencyView size="5" />hz
            <label>Key: </label>
            <select #triggerKey (change)="handleKeyChange($event)">
                <option *ngFor="let key of keys" [value]="key">{{ key.toUpperCase() }}</option>
            </select>
            <label>Note: </label>
            <select #note (change)="handleNoteChange($event)">
                <option *ngFor="let note of notes" [value]="note.frequency">{{note.name}}</option>
            </select>
        </div>
        <details class="patch">
            <summary>Patch</summary>
            <div class="knobs">
                <label *ngFor="let k of knobs" class="knob">
                    <span>{{ k.label }}</span>
                    <input type="range" [min]="k.min" [max]="k.max" [step]="k.step" [value]="params[k.name]"
                        (input)="setParam(k.name, $event.target.value)">
                    <output>{{ params[k.name] }}{{ k.unit }}</output>
                </label>
                <label class="knob">
                    <span>Filter</span>
                    <select (change)="setParam('filterType', $event.target.value)">
                        <option *ngFor="let t of filterTypes" [value]="t" [selected]="t == params.filterType">{{ t }}</option>
                    </select>
                </label>
                <label class="knob">
                    <span>LFO &rarr;</span>
                    <select (change)="setParam('lfoTarget', $event.target.value)">
                        <option *ngFor="let t of lfoTargets" [value]="t" [selected]="t == params.lfoTarget">{{ t }}</option>
                    </select>
                </label>
                <label class="knob">
                    <span>LFO depth</span>
                    <input type="range" min="0" [max]="lfoDepthRange.max" [step]="lfoDepthRange.step" [value]="params.lfoDepth"
                        (input)="setParam('lfoDepth', $event.target.value)">
                    <output>{{ params.lfoDepth }}{{ lfoDepthRange.unit }}</output>
                </label>
            </div>
        </details>
        <footer>Synth {{ version }}</footer>
    </div>
    <input #sliderVolume
        (mousemove)="handleVolume($event)"
        class="slider sliderVolume"
        orient="vertical"
        type="range" min="0" max="0.2" step="0.001" value="0.1">
</div>
